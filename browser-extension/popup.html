<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeVault</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>SafeVault</h1>
      <p id="status" role="status" aria-live="polite">正在检查当前页面...</p>
      <div id="accounts"></div>
      <form id="save-account-form">
        <h2>新增当前网站账号</h2>
        <label for="account-name">账户名称</label>
        <input id="account-name" name="accountName" required maxlength="200" autocomplete="off" />
        <label for="username">账号 / 用户名</label>
        <input id="username" name="username" required maxlength="320" autocomplete="off" />
        <label for="password">密码</label>
        <input id="password" name="password" type="password" required maxlength="4096" autocomplete="new-password" />
        <button type="submit">保存到默认标签</button>
      </form>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
