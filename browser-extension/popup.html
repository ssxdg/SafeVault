<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeVault</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <span class="brand-mark" aria-hidden="true">S</span>
        <div class="brand-copy">
          <h1>SafeVault</h1>
          <span>本地密码保险箱</span>
        </div>
      </header>

      <section class="site-panel" aria-label="当前网站状态">
        <span class="section-eyebrow">当前网站</span>
        <strong id="current-site">正在读取...</strong>
        <p id="status" role="status" aria-live="polite">正在检查当前页面...</p>
      </section>

      <section class="accounts-section" aria-labelledby="accounts-title">
        <div class="section-heading">
          <h2 id="accounts-title">可用账号</h2>
          <span id="account-count">—</span>
        </div>
        <div id="accounts"></div>
      </section>

      <details class="save-section">
        <summary>手动添加账号 <span aria-hidden="true">+</span></summary>
        <div class="save-content">
          <p>登录后也会提示保存；无法识别时可在此添加。</p>
          <form id="save-account-form">
            <label for="account-name">账户名称</label>
            <input id="account-name" name="accountName" required maxlength="200" autocomplete="off" placeholder="例如：工作账号" />
            <label for="username">账号 / 用户名</label>
            <input id="username" name="username" required maxlength="320" autocomplete="off" placeholder="输入账号" />
            <label for="password">密码</label>
            <input id="password" name="password" type="password" required maxlength="4096" autocomplete="new-password" placeholder="输入密码" />
            <label for="account-tab">保存到标签</label>
            <select id="account-tab" name="tabId" required disabled>
              <option value="">正在读取标签...</option>
            </select>
            <p id="tab-status" class="tab-status" role="status" aria-live="polite"></p>
            <p class="tab-hint">双击已有标签名称可改名（默认标签除外）。</p>
            <div id="tab-list" class="tab-list" aria-label="已有标签"></div>
            <button class="save-button" type="submit">保存账号 <span aria-hidden="true">→</span></button>
          </form>
        </div>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
